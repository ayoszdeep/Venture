services:
  mongo:
    image: mongo:7
    container_name: waygood-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    container_name: waygood-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      # Container-to-container DNS: `mongo` resolves to the service above.
      MONGODB_URI: mongodb://mongo:27017/waygood-evaluation
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      # Optional. Unset simply means the AI endpoint serves its rule-based plan.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: waygood-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
